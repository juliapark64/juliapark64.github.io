text: |
  Welcome to my website! I am a Fourth-year Doctor of Pharmacy candidate at the [University of Washington](https://www.washington.edu/) School of Pharmacy. My interests lie in oncology managed care and ambulatory care pharmacy, areas whose intersection is increasingly critical as high-cost oncology therapies and rapidly evolving ambulatory regimens reshape outpatient practice.

  I am drawn to managed care for the opportunity to ensure equitable access to expensive oncology medications, and to ambulatory care for its fast-moving therapeutic landscape. I have hands-on experience across community, hospital, ambulatory, and public-health practice settings, plus a background in structure-based drug-design research.

